<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DOH JAWDA Dashboard — Consultant View</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>

  <!-- Top Navigation -->
  <nav class="navbar navbar-expand-lg top-nav shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center" href="#" onclick="App.navigate('dashboard')">
        <i class="bi bi-shield-check fs-4 me-2 text-warning"></i>
        <span class="fw-bold">JAWDA <span class="fw-normal opacity-75">Consultant Portal</span></span>
      </a>
      
      <div class="d-flex align-items-center ms-auto gap-3">
        <!-- Global Facility Selector -->
        <div class="input-group input-group-sm w-auto">
          <span class="input-group-text bg-white border-end-0"><i class="bi bi-building text-muted"></i></span>
          <select class="form-select border-start-0 shadow-none fw-semibold" id="globalFacilitySelect" onchange="App.changeFacility(this.value)" style="max-width: 250px;">
            <option value="">Select Facility...</option>
          </select>
        </div>

        <!-- Global Year/Quarter Selector -->
        <select class="form-select form-select-sm w-auto" id="globalYearSelect" onchange="App.changeYear(this.value)"></select>
        <select class="form-select form-select-sm w-auto" id="globalQuarterSelect" onchange="App.changeQuarter(this.value)">
          <option value="1">Q1 (Jan-Mar)</option>
          <option value="2">Q2 (Apr-Jun)</option>
          <option value="3">Q3 (Jul-Sep)</option>
          <option value="4">Q4 (Oct-Dec)</option>
        </select>
      </div>
    </div>
  </nav>

  <div class="d-flex app-container">
    <!-- Sidebar -->
    <div class="sidebar bg-white border-end pt-3">
      <div class="nav flex-column px-2">
        <div class="text-uppercase text-muted small fw-bold mb-2 px-3">Facility View</div>
        <a href="#" class="nav-link nav-btn active" data-page="dashboard" onclick="App.navigate('dashboard')"><i class="bi bi-grid-1x2"></i> Dashboard</a>
        <a href="#" class="nav-link nav-btn py-1" data-page="proofs" onclick="App.navigate('proofs')"><i class="bi bi-calculator"></i> KPI Calculations (Proofs)</a>
        <a href="#" class="nav-link nav-btn" data-page="import" onclick="App.navigate('import')"><i class="bi bi-cloud-arrow-up"></i> Data Import</a>
        <a href="#" class="nav-link nav-btn" data-page="audit" onclick="App.navigate('audit')"><i class="bi bi-clipboard2-data"></i> Data Audit</a>
        <a href="#" class="nav-link nav-btn" data-page="manual" onclick="App.navigate('manual')"><i class="bi bi-pencil-square"></i> Manual Entry</a>
        <a href="#" class="nav-link nav-btn" data-page="reports" onclick="App.navigate('reports')"><i class="bi bi-file-earmark-pdf"></i> JAWDA Report</a>
        
        <div class="text-uppercase text-muted small fw-bold mb-2 mt-4 px-3">Analytics View</div>
        <a href="#" class="nav-link nav-btn" data-page="comparison" onclick="App.navigate('comparison')"><i class="bi bi-bar-chart-steps"></i> Quarterly Comparison</a>
        <a href="#" class="nav-link nav-btn" data-page="facilities" onclick="App.navigate('facilities')"><i class="bi bi-hospital"></i> Manage Facilities</a>
        <div class="text-uppercase text-muted small fw-bold mb-2 mt-4 px-3">System Settings</div>
        <a href="#" class="nav-link nav-btn py-1" data-page="settings-guidelines" onclick="App.navigate('settings-guidelines')"><i class="bi bi-journal-text"></i> DOH Guidelines</a>
        <a href="#" class="nav-link nav-btn py-1" data-page="settings-engine" onclick="App.navigate('settings-engine')"><i class="bi bi-cpu"></i> Engine Logic</a>
        <a href="#" class="nav-link nav-btn py-1" data-page="settings-clinical" onclick="App.navigate('settings-clinical')"><i class="bi bi-diagram-3"></i> KPI Mappings</a>
        <a href="#" class="nav-link nav-btn py-1" data-page="settings-dicts" onclick="App.navigate('settings-dicts')"><i class="bi bi-journal-medical"></i> DOH Dictionaries</a>
      </div>
    </div>

    <!-- Main Content Area -->
    <main class="main-content bg-light flex-grow-1 p-4 overflow-auto" id="app-content">
      <!-- Dynamic pages loaded here -->
    </main>
  </div>

  <!-- Toast Container -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="/js/app.js?v=1789200602687"></script>
  <script src="/js/dashboard.js?v=1789200602687"></script>
  <script src="/js/import.js?v=1789200602687"></script>
  <script src="/js/manual.js?v=1789200602687"></script>
  <script src="/js/reports.js?v=1789200602687"></script>
  <script src="/js/facilities.js?v=1789200602687"></script>
  <script src="/js/comparison.js?v=1789200602687"></script>
  <script src="/js/settings.js?v=1789200602687"></script>
  <script src="/js/audit.js?v=1789200602687"></script>
  <script src="/js/proofs.js?v=1789200602687"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      App.init();
    });
  </script>
</body>
</html>
